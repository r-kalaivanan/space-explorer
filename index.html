<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Space Explorer | Homepage</title>
    <link rel="icon" type="image/png" href="./images/fav-icon.png">
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <header>
        <span id="logo-image"><img src="./images/header-logo.png" height="75px" alt="Space Explorer Logo"></span>
        <nav id="nav-bar">
            <a href="/" class="nav-link">Missions</a>
            <a href="/" class="nav-link">About</a>
            <a href="/" class="nav-link">Gallery</a>
        </nav>
    </header>
    <main>
        <section id="hero-section">
            <div id="hero-content">
                <h1>Explore Beyond the Horizon</h1>
                <p>Discover the missions, worlds, and technologies helping humanity understand the universe beyond Earth.</p>
                <button>Explore</button>
            </div>
            <div id="hero-image">
                <img src="./images/hero-section.jpg" width="300px" alt="Apollo 11 astronaut Buzz Aldrin walks on the surface of the moon on July 20, 1969, in a photograph taken by Neil Armstrong">
            </div>
        </section>
        <section id="information-section">
            <h1>Journey through space</h1>
            <div id="figures">
                <figure class="figure">
                    <img src="./images/artemis.jpg" alt="NASA's Artemis program is building a path for human exploration of the Moon and preparing for future journeys deeper into space.">
                    <figcaption>NASA's Artemis program is building a path for human exploration of the Moon and preparing for future journeys deeper into space.</figcaption>
                </figure>
                <figure class="figure">
                    <img src="./images/mars.jpeg" alt="Robotic explorers on Mars study the planet's geology, climate, and history while searching for clues about its ancient environment.">
                    <figcaption>Robotic explorers on Mars study the planet's geology, climate, and history while searching for clues about its ancient environment.</figcaption>
                </figure>
                <figure class="figure">
                    <img src="/images/james-webb.webp" alt="The James Webb Space Telescope observes some of the most distant objects in the universe, helping scientists study stars, galaxies, and planetary systems.">
                    <figcaption>The James Webb Space Telescope observes some of the most distant objects in the universe, helping scientists study stars, galaxies, and planetary systems.</figcaption>
                </figure>
                <figure class="figure">
                    <img src="./images/earth.jpeg" alt="Satellites observing Earth help scientists understand our atmosphere, oceans, land, and the changing planet we call home.">
                    <figcaption>Satellites observing Earth help scientists understand our atmosphere, oceans, land, and the changing planet we call home.</figcaption>
                </figure>
            </div>
        </section>
        <section >

        </section>
    </main>
</body>
</html>
